name: ci

# Every push and every pull request. A suite that only runs when someone
# remembers is a suite that is already broken.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The deploy job asks for `id-token: write` itself, so
# nothing else in this file can mint an AWS credential.
permissions:
  contents: read

# The pipeline, in four stages:
#
#   backend ┐
#           ├─ integration ┐
#  frontend ┘         e2e ─┴─ deploy ─ (health check, inside the deploy job)
#
# The two test jobs are independent and run at once. The two stack jobs each
# build the compose stack and run their own suite against it — separate jobs
# rather than one, because they fail for different reasons and running them in
# parallel costs a rebuild and saves a minute of wall clock.

jobs:
  # ------------------------------------------------------------------ backend
  backend:
    name: backend
    runs-on: ubuntu-latest

    # The store contract runs against every implementation of it, and one of
    # them needs a server. Without this the Postgres half of tests/test_store.py
    # skips, and "all three are interchangeable" would be a claim nobody checks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nextlane
          POSTGRES_DB: nextlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway database in a throwaway container. The suite empties the
      # NextLane tables before every test.
      NEXTLANE_TEST_POSTGRES: postgresql://postgres:nextlane@localhost:5432/nextlane_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked
        working-directory: backend

      # Deliberately run through the Makefile rather than repeating its
      # commands here. Two copies of "how to test this project" drift, and the
      # one in CI is the copy nobody runs locally until it breaks.
      - name: Lint
        run: make lint

      - name: Type-check
        run: make types

      - name: Tests
        run: make test

      # The contract test compares openapi.yaml against the running app, so a
      # documented-but-missing endpoint already fails above. This checks the
      # file itself still parses, which that test assumes.
      - name: Contract parses
        run: uv run python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('../openapi.yaml').read_text(encoding='utf-8')); print('openapi.yaml parses')"
        working-directory: backend

  # ----------------------------------------------------------------- frontend
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No ESLint: that means npm and a node_modules, which decisions #3
      # avoided. This catches what actually breaks a no-build frontend — a
      # typo'd import path or a renamed export.
      - name: Check every module
        run: node frontend/check.mjs

      # The frontend has no test runner, but it does have to start. This is the
      # cheapest possible check that index.html and its modules are all present
      # and served — a missing file is a blank page, not an error.
      - name: It serves
        run: |
          python3 -m http.server 8000 --directory frontend &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8000/ > /dev/null
          curl -sf http://localhost:8000/src/main.js > /dev/null
          curl -sf http://localhost:8000/styles/tokens.css > /dev/null
          echo "frontend serves"

  # -------------------------------------------------------------- the stack
  integration:
    name: the compose stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked
        working-directory: backend

      # The suite brings the stack up and takes it down itself, under its own
      # compose project — see backend/tests/test_compose.py.
      - name: Integration tests
        run: make test-integration

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p nextlane-it logs --tail 100

  e2e:
    name: the app in a browser
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked
        working-directory: backend

      # Keyed on the lock file: the browser build is pinned by the Playwright
      # version, so a new browser is downloaded exactly when that changes.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
        working-directory: backend

      - name: End-to-end tests
        run: make test-e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p nextlane-e2e logs --tail 100

      # Playwright keeps traces and screenshots of failures; without this they
      # die with the runner and all anybody has is an assertion message.
      - name: Failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results/
          if-no-files-found: ignore

  # -------------------------------------------------------------------- deploy
  #
  # Off until an AWS account is wired up. `vars.AWS_DEPLOY_ROLE_ARN` is a
  # repository variable, and while it is unset this job skips — the pipeline
  # stays green and nothing is billed to anybody.
  #
  # To turn it on: deploy `infra/github-oidc-role.yaml` once, then set
  # AWS_DEPLOY_ROLE_ARN, AWS_REGION and ECR_REPOSITORY as repository variables.
  # There is no access key anywhere in this file and there should never be one:
  # the role is assumed with a GitHub-issued OIDC token that lasts minutes and
  # cannot be copied out of a log.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [integration, e2e]
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.AWS_DEPLOY_ROLE_ARN != ''

    environment:
      name: production
      url: ${{ steps.stack.outputs.url }}

    permissions:
      id-token: write # to request the OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: nextlane-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit rather than `latest`, so what is running can be
      # traced back to a commit and a rollback is a tag away.
      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:${{ github.sha }}" .
          docker push "$REGISTRY/$REPOSITORY:${{ github.sha }}"

      - name: Deploy the stack
        id: stack
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          aws cloudformation deploy \
            --stack-name nextlane \
            --template-file infra/app.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ImageUri=$REGISTRY/$REPOSITORY:${{ github.sha }}"

          url=$(aws cloudformation describe-stacks \
            --stack-name nextlane \
            --query 'Stacks[0].Outputs[?OutputKey==`Url`].OutputValue' \
            --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed to $url"

      # The deploy is not finished when CloudFormation says so — it is finished
      # when the thing answers. `/api/health` reports whether the database
      # answered too, so a container that came up next to a database that did
      # not fails here rather than in front of a user.
      - name: Wait for it to be healthy
        env:
          URL: ${{ steps.stack.outputs.url }}
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 5 "$URL/api/health" 2>/dev/null) && {
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && {
                echo "healthy after ${attempt} attempt(s)"
                exit 0
              }
            }
            echo "not healthy yet (${attempt}/30)"
            sleep 10
          done

          echo "::error::$URL/api/health never reported ok"
          curl -s -o /dev/null -w 'last status: %{http_code}\n' "$URL/api/health" || true
          exit 1

      - name: Smoke the app itself
        env:
          URL: ${{ steps.stack.outputs.url }}
        run: |
          # Health says the API can serve. This says a person would see the app:
          # the container carries the frontend, and it is being served.
          curl -fsS "$URL/" | grep -q '<title>NextLane</title>'
          curl -fsS -o /dev/null "$URL/src/main.js"
          echo "the app is being served"

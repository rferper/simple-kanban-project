[project]
name = "nextlane-backend"
version = "0.1.0"
description = "NextLane API — FastAPI backend, against a mock database for now"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Job-advert extraction (issue #20). The API runs without it configured -
    # see app/ai.py - but the official SDK is how the model call is made.
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# Not a distributable package — it is an application that is run, not imported.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
